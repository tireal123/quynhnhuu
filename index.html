<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quỳnh Như xinh đẹp 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Nunito', sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5);
}

/* Layout */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255, 105, 180, 0.2);
    width: 90%;
    max-width: 330px;
}

/* Text */
h1 {
    color: #ff66a3;
    margin-bottom: 20px;
    font-size: 20px;
}

/* Buttons */
.btn-group {
    display: flex;
    justify-content: center;
    gap: 12px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
}

/* YES */
#yes {
    background: linear-gradient(135deg, #ff85a2, #ffb6c1);
    color: white;
    box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
}

/* NO */
#no {
    background: #ddd;
    color: #555;
}

/* LOVE PAGE */
.love-page {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(135deg, #ffb6c1, #ffe4ec);
    text-align: center;
}

/* Glow text */
.love-page h1 {
    font-size: 42px;
    color: white;
    text-shadow: 0 0 10px #fff, 0 0 20px #ff66a3;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px #fff; }
    to { text-shadow: 0 0 30px #ff4d88; }
}

/* Heart beat */
.big-heart {
    font-size: 120px;
    animation: beat 1s infinite;
}

@keyframes beat {
    0% { transform: scale(1); }
    30% { transform: scale(1.2); }
    60% { transform: scale(0.9); }
    100% { transform: scale(1); }
}

/* Heart bay */
.heart {
    position: absolute;
    bottom: -20px;
    animation: fly 4s linear forwards;
}

@keyframes fly {
    to {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
    }
}

/* Confetti */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<audio id="music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<div class="container" id="main">
    <div class="card">
        <h1>Em xinh vậy chắc có bồ rồi ha? 🥺</h1>

        <div class="btn-group">
            <button id="yes">Chưa có 💖</button>
            <button id="no">Có rồi 🥲</button>
        </div>
    </div>
</div>

<div class="love-page" id="lovePage">
    <h1 id="loveText"></h1>
    <div class="big-heart">💗</div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const music = document.getElementById("music");

let clickCount = 0;
let scale = 1;

// 👉 Khi bấm "Có rồi"
noBtn.addEventListener("click", () => {
    clickCount++;

    // Lấy vị trí nút NO
    const rect = noBtn.getBoundingClientRect();

    // Cho YES đè lên
    yesBtn.style.position = "absolute";
    yesBtn.style.left = rect.left + "px";
    yesBtn.style.top = rect.top + "px";
    yesBtn.style.zIndex = "10";

    // Phóng to dần
    scale += 0.4;
    yesBtn.style.transform = "scale(" + scale + ")";
    yesBtn.style.transition = "0.2s";

    // Sau 4 lần thì NO biến mất
    if (clickCount >= 4) {
        noBtn.style.display = "none";
    }
});

// 👉 Hiệu ứng chữ chạy
function typeEffect(text, element, speed = 60) {
    let i = 0;
    element.innerHTML = "";

    function typing() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

// 👉 Khi bấm "Chưa có"
yesBtn.addEventListener("click", () => {
    document.getElementById("main").style.display = "none";
    document.getElementById("lovePage").style.display = "flex";

    music.play().catch(()=>{});

    typeEffect("Cho anh tìm hiểu em nha 💕", document.getElementById("loveText"));

    startHearts();
    startConfetti();
});

// 👉 Trái tim bay
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random()*30) + "px";

        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),4000);
    }, 200);
}

// 👉 Confetti
function startConfetti() {
    setInterval(() => {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = ["#ff4d88","#ffd700","#00ccff","#ff66cc"][Math.floor(Math.random()*4)];

        document.body.appendChild(c);
        setTimeout(()=>c.remove(),3000);
    }, 100);
}
</script>

</body>
</html>
